# Render blueprint for the PUBLIC DEMO (DEMO_MODE=true — submissions are
# stored and streamed over the WebSocket, but never sent to a sandbox,
# because arbitrary code execution isn't safe on shared free hosting).
#
# Deploy: Render dashboard -> New + -> Blueprint -> pick this repo -> Apply.
# For real judging, run docker-compose locally instead (see README).

databases:
  - name: virtual-judge-db
    plan: free
    databaseName: judge
    user: judge

services:
  # Render's managed Redis (used by the API's pub/sub + WebSocket hub).
  - type: keyvalue
    name: virtual-judge-redis
    plan: free
    ipAllowList: [] # internal connections only

  - type: web
    name: virtual-judge-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node packages/infra/dist/seed.js && node apps/api/dist/api-server.js
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-judge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: virtual-judge-redis
          property: connectionString

  - type: web
    name: virtual-judge-frontend
    runtime: static
    buildCommand: npm ci && npm run build -w @vj/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: virtual-judge-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
